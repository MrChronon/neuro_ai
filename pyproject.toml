[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-ai"
version = "0.1.0"
description = "Learning-to-research project in neuroimaging, computational neuroscience, and NeuroAI"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
